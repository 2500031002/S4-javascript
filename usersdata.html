<!DOCTYPE html>
<html>
    <head>
        <title>User Data</title>
    </head>
    <body>
        <h2 style="text-align: center; text-decoration: underline;">User Data</h2>
        <table id="user"></table>
        <script>
            async function getData() {
                try {
                    let response = await fetch("https://jsonplaceholder.typicode.com/users/")
                    let data = await response.json();
                    return data;
                } catch (error) {
                    console.log("Error: "+error)
                }
            }
            async function showData() {
                try{
                    let data = await getData();
                    const tab = document.getElementById("user");
                    tab.setAttribute("border",1)
                    tab.setAttribute("align","center")
                    const row = document.createElement("tr")
                    const thead = document.createElement("th")
                    const text = document.createTextNode("Name")
                    const thead1 = document.createElement("th")
                    const text1 = document.createTextNode("Email")
                    const thead2 = document.createElement("th")
                    const text2 = document.createTextNode("Phone No")
                    thead.appendChild(text)
                    thead1.appendChild(text1)
                    thead2.appendChild(text2)
                    row.appendChild(thead)
                    row.appendChild(thead1)
                    row.appendChild(thead2)
                    tab.appendChild(row)
                    const action = document.createTextNode("action")

                    data.forEach(user => {
                        tab.innerHTML += `
                        <tr>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td><button>
                            </tr>`
                        
                    });
                }catch(error){
                    console.log(error)
                }
            }
            showData()
        </script>
    </body>
</html>
